<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PNGCenter AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#06142e;
    color:#00d4ff;
    text-align:center;
    padding:25px;
    font-size:40px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:800px;
    margin:50px auto;
    text-align:center;
}

h1{
    font-size:50px;
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:30px;
}

textarea{
    width:100%;
    height:180px;
    padding:20px;
    border-radius:15px;
    border:2px solid #333;
    font-size:20px;
    resize:none;
}

button{
    margin-top:25px;
    padding:18px 50px;
    border:none;
    border-radius:10px;
    background:#ff6b00;
    color:#fff;
    font-size:24px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#e65c00;
}

#loading{
    display:none;
    font-size:22px;
    margin-top:20px;
    color:#333;
}

#image-container{
    margin-top:40px;
}

#generated-image{
    max-width:100%;
    border-radius:15px;
    display:none;
}

.download-btn{
    display:none;
    margin-top:20px;
    background:green;
}

footer{
    background:#06142e;
    color:#fff;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>
</head>

<body>

<header>PNGCenter AI</header>

<div class="container">
    <h1>Free AI Image Generator</h1>
    <p>Create stunning AI images instantly for free</p>

    <textarea id="prompt" placeholder="Write your image prompt here..."></textarea>

    <br>
    <button onclick="generateImage()">Generate Image</button>

    <div id="loading">
        Generating Image... Please Wait ⏳
    </div>

    <div id="image-container">
        <img id="generated-image">

        <br>
        <a id="download-link" download="ai-image.png">
            <button class="download-btn" id="download-btn">
                Download Image
            </button>
        </a>
    </div>
</div>

<footer>
© 2026 PNGCenter AI - All Rights Reserved
</footer>

<script>
async function generateImage() {

    const prompt = document.getElementById("prompt").value;

    if(!prompt){
        alert("Please enter image prompt");
        return;
    }

    document.getElementById("loading").style.display = "block";

    try {

        const imageUrl =
        "https://image.pollinations.ai/prompt/" +
        encodeURIComponent(prompt);

        const img =
        document.getElementById("generated-image");

        img.src = imageUrl;

        img.onload = function(){
            document.getElementById("loading").style.display = "none";
            img.style.display = "block";
            document.getElementById("download-btn").style.display = "inline-block";
            document.getElementById("download-link").href = imageUrl;
        }

    } catch(error){
        alert("Error generating image");
        console.error(error);
    }
}
</script>

</body>
</html>
