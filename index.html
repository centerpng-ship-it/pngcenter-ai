<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNGCenter AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
    text-align:center;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#00d4ff;
}

.hero{
    padding:60px 20px;
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

p{
    color:#555;
}

textarea{
    width:80%;
    max-width:700px;
    height:150px;
    padding:15px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:18px;
}

button{
    background:#ff6600;
    color:white;
    border:none;
    padding:15px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#e55b00;
}

.footer{
    margin-top:60px;
    background:#111827;
    color:white;
    padding:20px;
}
</style>

</head>
<body>

<header>
    <div class="logo">PNGCenter AI</div>
</header>

<section class="hero">
    <h1>Free AI Image Generator</h1>
    <p>Create stunning AI images instantly for free</p>

    <textarea placeholder="Write your image prompt here..."></textarea>
    <br>
    <button>Generate Image</button>
</section>

<div class="footer">
    © 2026 PNGCenter AI - All Rights Reserved
</div>

</body>
</html>
